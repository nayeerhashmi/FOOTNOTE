name: Create FOOTNOTE video

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "What should the FOOTNOTE video be about?"
        required: true
        type: string
      title:
        description: "Optional short title shown on the opening card"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install video and narration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Create vertical video
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          mkdir -p output
          python scripts/create_video.py --idea "$VIDEO_IDEA" --title "$VIDEO_TITLE" --output output/footnote-video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: footnote-video
          path: output/footnote-video.mp4
          if-no-files-found: error
          retention-days: 7
